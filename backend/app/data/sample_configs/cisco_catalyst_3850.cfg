version 16.12
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname EDGE-SW-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
username operator privilege 1 password 7 0822455D0A16
!
aaa new-model
!
aaa authentication login default local
aaa authorization exec default local
!
ip domain name enterprise.internal
ip name-server 10.10.1.10
ip name-server 10.10.1.11
!
ip ssh version 1
!
! Telnet and HTTP services active (Security Violation)
ip http server
no ip http secure-server
!
! Insecure SNMP Community Strings
snmp-server community public RO
snmp-server community private RW
snmp-server location DataCenter-Rack-04
snmp-server contact noc@enterprise.internal
!
! Missing Central Logging Server and NTP
!
interface GigabitEthernet1/0/1
 description Trunk to Core-Router-01
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet1/0/2
 description Access Port - Unused
 switchport mode access
 switchport access vlan 10
! (Unused port is NOT shutdown - Security Violation)
!
interface GigabitEthernet1/0/3
 description Management Interface
 ip address 10.10.99.15 255.255.255.0
 no shutdown
!
interface Vlan1
 no ip address
 shutdown
!
banner motd ^C
UNAUTHORIZED ACCESS TO THIS NETWORK DEVICE IS STRICTLY PROHIBITED
All activities are monitored and logged.
^C
!
line con 0
 exec-timeout 0 0
 stopbits 1
line vty 0 4
 transport input telnet ssh
 exec-timeout 60 0
line vty 5 15
 transport input all
 exec-timeout 60 0
!
end
