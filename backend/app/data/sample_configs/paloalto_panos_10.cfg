set deviceconfig system hostname "DC-PAN-FW01"
set deviceconfig system ip-address 10.200.1.1 netmask 255.255.255.0 default-gateway 10.200.1.254
set deviceconfig system dns-setting servers primary 8.8.8.8
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address time.nist.gov
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system login-banner "AUTHORIZED USE ONLY. UNAUTHORIZED ACTIVITY WILL BE PROSECUTED."
set deviceconfig system idle-timeout 60
set mgt-config users admin password-hash "$1$v1v9z91Z$F0a93bK9qwe"
set mgt-config users admin permissions role-based superuser yes
set shared log-settings syslog "CORP-SIEM" server 10.200.5.50 transport UDP port 514 format BSD facility LOG_USER
set rulebase security rules "Outbound-Web" from Trust to Untrust source any destination any service [ service-http service-https ] action allow log-end yes
set rulebase security rules "Default-Deny-All" from any to any source any destination any application any service any action deny log-end yes
