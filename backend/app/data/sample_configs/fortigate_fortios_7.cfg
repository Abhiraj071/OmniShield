#config-version=FG60E-7.0.5-FW-build0304-220412:opmode=0:vdom=0:user=admin
#conf_file_ver=14728514937201
#buildno=0304
#global_vdom=1
config system global
    set hostname "CORP-FW-01"
    set timezone 04
    set admintimeout 45
    set admin-sport 8443
    set admin-ssh-port 22
    set admin-telnet enable
    set pre-login-banner enable
end
config system admin
    edit "admin"
        set trusthost1 192.168.1.0 255.255.255.0
        set accprofile "super_admin"
        set vdom "root"
        set password ENC AK1b578c93...
    next
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 192.168.1.0 255.255.255.0
            next
        end
    next
end
config log syslogd setting
    set status disable
    set server ""
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "pool.ntp.org"
        next
    end
end
config firewall policy
    edit 1
        set name "Allow-Corp-Outbound"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "Inbound-DMZ"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "Web_VIP"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
end
