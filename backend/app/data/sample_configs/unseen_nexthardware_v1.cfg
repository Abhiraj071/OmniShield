# =======================================================
# NexaEdge OS Configuration (Proprietary Hardware Build v4.9)
# Device: NexaEdge 9200-X HyperScale Gateway
# Hardware-ID: NX92-SN-99882211
# =======================================================

system-profile
  core-host-label "NEXA-GATEWAY-X1"
  sys-serial-number "NX92-SN-99882211"
  firmware-build "v4.9.2-enterprise"
exit

remote-management
  # Non-standard CLI keyword for session timeout:
  session-inactivity-grace-timer minutes 45
  # Non-standard command for telnet:
  legacy-cleartext-telnet state active
  # Non-standard command for secure shell:
  secure-shell-daemon crypto-level version-2-strict
  web-gui-engine tls-only enable
  web-gui-engine cleartext-http disable
exit

security-compliance
  # Custom banner keyword:
  legal-disclaimer-text "WARNING: RESTRICTED GOVERNMENT CONTRACTOR SYSTEM. UNAUTHORIZED ACCESS IS A CRIME."
  # Custom AAA settings:
  credential-storage-hashing algorithm argon2id
  failed-authentication-lockout attempts 3 duration 900
exit

telemetry-and-audit
  # Unrecognized SIEM command:
  siem-remote-collector-endpoint udp://10.99.100.25:514
  # Unrecognized NTP sync syntax:
  clock-synchronization-peer ip 10.99.1.5
  snmp-v1-v2-legacy-agents state inactive
  snmp-v3-secure-engine state active
exit

port-configuration
  port ge-0/0/1 role upstream-core admin-state up
  port ge-0/0/2 role edge-access admin-state up
  port ge-0/0/3 role unallocated admin-state down
exit
